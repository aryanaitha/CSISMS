version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: csims-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Aryan@2007
      MYSQL_DATABASE: csims_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_csims_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pAryan@2007"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_csims_data:
    driver: local
